services:
  test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U test -d test']
      interval: 1s
      timeout: 2s
      retries: 30
  test-redis:
    image: redis:7-alpine
  tests:
    image: golang:1.26-alpine
    working_dir: /src
    volumes: [./backend:/src, test-go-cache:/root/.cache/go-build, test-go-mod:/go/pkg/mod]
    environment:
      TEST_DATABASE_URL: postgres://test:test@test-postgres:5432/test?sslmode=disable
      TEST_REDIS_URL: redis://test-redis:6379/0
    depends_on:
      test-postgres: {condition: service_healthy}
      test-redis: {condition: service_started}
    command: sh test.sh

volumes:
  test-go-cache:
  test-go-mod:

