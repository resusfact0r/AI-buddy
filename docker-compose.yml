services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-only-password}
      POSTGRES_DB: buddy
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U buddy -d buddy']
      interval: 3s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 20
  migrate:
    image: migrate/migrate:v4.18.1
    volumes: [./backend/migrations:/migrations:ro]
    command: ['-path', /migrations, '-database', 'postgres://buddy:${POSTGRES_PASSWORD:-demo-only-password}@postgres:5432/buddy?sslmode=disable', up]
    depends_on:
      postgres: {condition: service_healthy}
  corp-mock:
    build: ./backend
    command: corp-mock
    environment:
      DATABASE_URL: postgres://buddy:${POSTGRES_PASSWORD:-demo-only-password}@postgres:5432/buddy?sslmode=disable
      CORP_TOKEN: ${CORP_TOKEN:-local-demo-corporate-service-token}
      CORP_MOCK_FAIL_RATE: ${CORP_MOCK_FAIL_RATE:-0}
    ports: ['127.0.0.1:8090:8090']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:8090/healthz']
      interval: 5s
      timeout: 2s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://buddy:${POSTGRES_PASSWORD:-demo-only-password}@postgres:5432/buddy?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-jwt-secret-32-characters}
      CORP_TOKEN: ${CORP_TOKEN:-local-demo-corporate-service-token}
      CORP_MOCK_URL: http://corp-mock:8090
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      corp-mock: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:8080/readyz']
      interval: 5s
      timeout: 2s
      retries: 10
  web:
    build: ./web
    environment:
      # Адреса, по которым к API ходит браузер, а не сеть Compose
      API_URL: ${WEB_API_URL:-/api/v1}
      AGENT_URL: ${WEB_AGENT_URL:-/api/v1}
      USE_MOCKS: ${WEB_USE_MOCKS:-false}
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: {condition: service_healthy}
      agent: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3000/healthz']
      interval: 5s
      timeout: 2s
      retries: 10
  mcp:
    build: ./agent
    command: ["mcp"]
    environment:
      API_BASE_URL: http://api:8080
      MCP_ADDR: ":8082"
      TOOL_TIMEOUT_SEC: ${TOOL_TIMEOUT_SEC:-5}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  agent:
    build: ./agent
    command: ["agent"]
    environment:
      API_BASE_URL: http://api:8080
      MCP_URL: http://mcp:8082
      REDIS_URL: redis://redis:6379/0
      AGENT_ADDR: ":8081"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      TZ: ${TZ:-Europe/Moscow}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      mcp:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
