server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

  # runtime-конфиг и service worker моков не кешируем
  location = /env.js { add_header Cache-Control "no-store"; try_files $uri =404; }
  location = /mockServiceWorker.js { add_header Cache-Control "no-store"; try_files $uri =404; }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: все маршруты отдают index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
