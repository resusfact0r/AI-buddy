server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

  # runtime-конфиг и service worker моков не кешируем
  location = /env.js { add_header Cache-Control "no-store"; try_files $uri =404; }
  location = /mockServiceWorker.js { add_header Cache-Control "no-store"; try_files $uri =404; }

  location /api/v1/agent/ {
    set $agent_upstream http://agent:8081;
    proxy_pass $agent_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 90s;
  }
  location /api/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream$request_uri;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: все маршруты отдают index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
